# SIFT100M 5-storage-node compute-side benchmark config.
# The companion run_mixed_benchmark.sh can generate an equivalent runtime config
# with HOST/ports overridden from the environment.
servers = 127.0.0.1:1234 127.0.0.1:1235 127.0.0.1:1236 127.0.0.1:1237 127.0.0.1:1238
initiator = true
port = 1234
threads = 16
coroutines = 16
dim = 128
k = 10
R = 48
beam-width = 32
beam-width-construction = 320
alpha = 1.2
rabitq-bits = 4
search-mode = rabitq_gpu
insert-execution = storage_owner
storage-owner-cache-mb = 1024
storage-owner-peer-rdma-tokens = 8
storage-owner-rpc-depth = 4
storage-owner-construction-beam-width = 128
storage-owner-search-snapshot-batch = 64
storage-owner-prune-max-candidates = 128
storage-owner-reverse-mode = async
storage-owner-reverse-queue-depth = 65536
storage-owner-reverse-flush-us = 200
storage-owner-reverse-coalesce-max = 256
storage-id = 0
storage-peers = 127.0.0.1:2234 127.0.0.1:2235 127.0.0.1:2236 127.0.0.1:2237 127.0.0.1:2238
load-index = true
index-prefix = /data/xjs/index/dvstor/sift100m/sift100m
gpu-device = 0
max-vectors = 100000000
cn-memory = 24
mn-memory = 32
query-workers = 16
query-coroutines = 4
cache = true
cache-ratio = 5
disable-thread-pinning = false
neighbor-cache-mb = 2048
neighbor-cache-invalidation-ms = 100
neighbor-cache-invalidation-inserts = 1024
gpudirect-rdma = true
gpu-rabitq-cache-mb = 8192
rabitq-cache-mode = slot_clock
gentile-tile-slots = 32
gentile-nursery-ratio = 0.25
gentile-promotion-threshold = 2
gentile-enable-promotion = false
gentile-enable-value-bin = false
gentile-enable-hit-tile-grouping = true
insert-start-id = 100010000
